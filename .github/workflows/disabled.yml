# GitHub Actions is disabled
# We use .cpanel.yml for automatic deployment via cPanel Git Version Control
# This file prevents GitHub Actions from running

name: Disabled

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  disabled:
    runs-on: ubuntu-latest
    steps:
      - name: Workflow Disabled
        run: echo "GitHub Actions is disabled. Using .cpanel.yml for deployment."
        if: false  # This will never run

